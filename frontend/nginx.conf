upstream ediary_backend {
    zone ediary_backend 64k;
    resolver ${NGINX_RESOLVER} valid=10s;
    resolver_timeout 5s;
    server ${BACKEND_HOST}:${BACKEND_PORT} resolve;
}

map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://ediary_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
