name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Build and analyze
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ediary
          POSTGRES_USER: ediary
          POSTGRES_PASSWORD: ediary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ediary -d ediary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        id: java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test backend and generate JaCoCo coverage
        working-directory: backend
        env:
          EDIARY_RUN_DB_TESTS: 'true'
          EDIARY_DB_URL: jdbc:postgresql://127.0.0.1:5432/ediary
          EDIARY_DB_USERNAME: ediary
          EDIARY_DB_PASSWORD: ediary
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress verify
          org.apache.maven.plugins:maven-dependency-plugin:3.10.0:copy-dependencies
          -DincludeScope=compile

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend and generate LCOV coverage
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:coverage

      - name: Analyze backend and frontend
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=konnzy
            -Dsonar.projectKey=Konnzy_EDiary
            -Dsonar.sources=backend/src/main,frontend/src
            -Dsonar.exclusions=frontend/src/**/*.test.*
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.java.libraries=backend/target/dependency/*.jar
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/node.lcov,frontend/coverage/browser/lcov.info
            -Dsonar.java.source=25
            "-Dsonar.java.jdkHome=${{ steps.java.outputs.path }}"
