services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ediary-backend:local
    container_name: ediary-backend
    restart: unless-stopped
    environment:
      EDIARY_DB_URL: jdbc:postgresql://${EDIARY_DB_HOST:-host.docker.internal}:${EDIARY_DB_PORT:-5432}/${EDIARY_DB_NAME:-ediary}
      EDIARY_DB_USERNAME: ${EDIARY_DB_USERNAME:-ediary}
      EDIARY_DB_PASSWORD: ${EDIARY_DB_PASSWORD:-ediary}
      EDIARY_SERVER_PORT: 8081
      EDIARY_FRONTEND_URL: http://127.0.0.1:${EDIARY_FRONTEND_PORT:-5173}
      EDIARY_ALLOWED_ORIGINS: http://127.0.0.1:${EDIARY_FRONTEND_PORT:-5173},http://localhost:${EDIARY_FRONTEND_PORT:-5173}
    ports:
      - "127.0.0.1:${EDIARY_SERVER_PORT:-8081}:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: ediary-frontend:local
    container_name: ediary-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDIARY_FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_started
