spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: backend
  datasource:
    url: ${EDIARY_DB_URL:jdbc:postgresql://localhost:5432/ediary}
    username: ${EDIARY_DB_USERNAME:ediary}
    password: ${EDIARY_DB_PASSWORD:ediary}
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${EDIARY_MAIL_HOST:localhost}
    port: ${EDIARY_MAIL_PORT:1025}
    username: ${EDIARY_MAIL_USERNAME:}
    password: ${EDIARY_MAIL_PASSWORD:}
    test-connection: ${EDIARY_MAIL_TEST_CONNECTION:false}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${EDIARY_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${EDIARY_MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${EDIARY_MAIL_STARTTLS_REQUIRED:false}
      mail.smtp.ssl.enable: ${EDIARY_MAIL_SSL:false}
      mail.smtp.connectiontimeout: ${EDIARY_MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${EDIARY_MAIL_READ_TIMEOUT:5000}
      mail.smtp.writetimeout: ${EDIARY_MAIL_WRITE_TIMEOUT:5000}

server:
  port: ${EDIARY_SERVER_PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${EDIARY_SECURE_COOKIE:false}
        same-site: strict

logging:
  file:
    name: ${EDIARY_LOG_FILE:logs/ediary.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
      clean-history-on-start: true
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{48} requestId=%X{requestId:-none} actorId=%X{actorId:-none} job=%X{job:-none} %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{48} requestId=%X{requestId:-none} actorId=%X{actorId:-none} job=%X{job:-none} %msg%n"
  level:
    com.ediary.backend: ${EDIARY_LOG_LEVEL:INFO}
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

app:
  notifications:
    absence-email-delay: ${EDIARY_ABSENCE_EMAIL_DELAY:PT1M}
    email-poll-interval: ${EDIARY_NOTIFICATION_EMAIL_POLL_INTERVAL:10000}
  parent-link-code:
    secret: ${EDIARY_PARENT_LINK_CODE_SECRET:local-development-parent-code-secret-change-me}
  password-reset:
    frontend-url: ${EDIARY_FRONTEND_URL:http://127.0.0.1:5173}
  security:
    allowed-origins: ${EDIARY_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5173}
  bootstrap-admin:
    enabled: ${EDIARY_BOOTSTRAP_ADMIN_ENABLED:false}
    login: ${EDIARY_BOOTSTRAP_ADMIN_LOGIN:}
    email: ${EDIARY_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${EDIARY_BOOTSTRAP_ADMIN_PASSWORD:}
    access-code: ${EDIARY_BOOTSTRAP_ADMIN_ACCESS_CODE:}
    first-name: ${EDIARY_BOOTSTRAP_ADMIN_FIRST_NAME:}
    last-name: ${EDIARY_BOOTSTRAP_ADMIN_LAST_NAME:}
  mail:
    enabled: ${EDIARY_MAIL_ENABLED:false}
    provider: ${EDIARY_MAIL_PROVIDER:smtp}
    gmail:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_REFRESH_TOKEN:}
    from: ${EDIARY_MAIL_FROM:no-reply@ediary.local}
    from-name: ${EDIARY_MAIL_FROM_NAME:Електронний щоденник}
